name: Crypto Bot Polling

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot (single poll)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_PROXY: ${{ secrets.TG_PROXY }}
          ADMIN_CHAT_ID: ${{ secrets.TG_CHAT }}
        run: |
          python bot_handler.py

      - name: Commit user_state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add user_state.json redeem_codes.json extended_tickers.json || true
          git diff --cached --quiet && echo "Нет изменений" || (git commit -m "Auto: bot update [skip ci]" && git push)
